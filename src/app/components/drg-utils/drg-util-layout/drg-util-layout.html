<div class="drg-util-shell pk-font-bai-jamjuree">
  <pk-sidenav [groups]="navGroups()" [activeKey]="activeKey()" mode="auto" [theme]="sidenavTheme()" [breakpoint]="768">
    <div pkSidenavHeader style="display:flex;align-items:center;gap:10px;font-weight:700;">
      <span class="w-9"><img src="images/logomoph.png" alt=""></span>
      <span class="pk-snv-hide-on-icon flex flex-col">
        <span>{{ config().appCode }}</span>
        <span class="text-xs">v.{{ config().version }}</span>
      </span>
    </div>

    <div pkSidenavUser class="flex flex-col gap-2 shrink-0">
      <!-- User Info -->
      <div class="flex items-center gap-2">
        <pk-icon iconSet="google" name="account_circle" [size]="24" />
        <div class="min-w-0 flex-1" pkTooltip="{{ userInfo().position }} {{ userInfo().hname ?? userInfo().hospname }}"
          tooltipPlacement="top">
          <p class="text-xs font-semibold text-white truncate leading-tight">{{ userInfo().fullname || userInfo().name
            }}</p>
          <p class="text-[10px] text-orange-300 truncate leading-tight">{{ userInfo().hname ?? userInfo().hospname }}
          </p>
        </div>
        <pk-icon iconSet="google" name="logout" [size]="18" class="text-gray-400 cursor-pointer hover:text-white"
          pkTooltip="ออกจากระบบ" (click)="logout()"></pk-icon>
      </div>

      <!-- Theme Selector -->
      <div class="pk-snv-hide-on-icon flex items-center gap-1">
        <span class="text-xs">Theme:</span>
        <select [value]="sidenavTheme()" [(ngModel)]="theme" (change)="changeTheme($any($event.target).value)"
          class="w-full px-2 py-1 text-xs" pkTooltip="เลือก Theme" tooltipPlacement="top"
          style="background-color: rgba(255, 254, 254, 0.088); border-radius: 4px; color: white;">
          @for (option of themeOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </div>
    </div>
  </pk-sidenav>
  <main class="drg-util-content m-2 sm:m-4">
    <router-outlet />
  </main>
</div>
